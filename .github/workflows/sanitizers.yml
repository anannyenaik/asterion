name: sanitizers

# Default Address/UndefinedBehaviour correctness lane. The metadata parser uses
# bounded iterative scanning, so the full public-L2 model-contract fixture stays
# covered without a raised stack limit. This workflow does not install ONNX
# Runtime, build benchmarks, gate on benchmark numbers, or make a performance
# claim.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-ubsan:
    name: asan-ubsan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang git

      # Debug + ASan/UBSan over the unit/golden/property suite only. No
      # benchmarks are built here; this lane is for memory/UB safety, not timing.
      - name: Configure (Debug + Address/UndefinedBehaviour sanitizers)
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DASTERION_ENABLE_WARNINGS=ON \
            -DASTERION_ENABLE_SANITIZERS=ON \
            -DASTERION_BUILD_BENCHMARKS=OFF

      - name: Build tests
        run: cmake --build build-san --target asterion_tests

      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure
